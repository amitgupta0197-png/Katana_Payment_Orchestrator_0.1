name: Android Agent APK

# Builds the Katana Agent debug APK on every change under apps/android-agent and
# publishes it as a downloadable workflow artifact (no local toolchain needed).
# Manually triggerable via the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/android-agent/**"
      - ".github/workflows/android-agent.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: katana-agent-debug-apk
          path: apps/android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
